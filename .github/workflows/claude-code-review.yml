name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          show_full_output: true # TEMPORARY — diagnosing recurring permission_denials_count (0-9/run, uncorrelated with diff size); revert once found
          prompt: |
            Review this pull request against the architecture and conventions
            documented in CLAUDE.md (versioning structure, auth schemes, the
            Strategy Pattern used for ICsvReaderService/IJobStore, the
            characterization-testing rule for StatusCategorizerService, and
            the async job/DI-scope pattern in JobsController).

            Start with `gh pr diff` to see the full changeset in one call —
            don't reconstruct it by reading files individually.

            This review is read-only by design: you have Read/Grep/Glob plus
            `gh pr diff`/`gh pr view` only. Do not attempt to run the test
            suite, build the project, `git fetch`, or search the filesystem
            with `find` — none of those are available and each attempt costs
            a wasted turn. Evaluate test coverage and correctness by reading
            the test files, not by executing them. When leaving an inline
            comment, only target lines that appear in the `gh pr diff` output.

            Flag:
            - Bugs, security issues, or unhandled edge cases
            - Deviations from established patterns without a stated reason
            - Missing or weakened tests for changed behavior
            - Any accidental change to frozen characterization test behavior

            Post the review as a PR comment (update_claude_comment) and use
            inline comments for specific line-level issues. Do not push commits.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment"

# Setup required (one-time, done by Michael in GitHub, not by Claude):
# 1. Repo Settings -> Secrets and variables -> Actions -> New repository secret
#    Name: ANTHROPIC_API_KEY   Value: <your Anthropic API key>
# 2. Verify the action name/inputs against the current anthropics/claude-code-action
#    marketplace listing before first run -- GitHub Action interfaces do change
#    versions, and this was written from the pattern as of this session.
#
# Cost fix, part 1 (2026-07-30): the first four runs of this workflow defaulted
# to claude-opus-5[1m] (no model pin) and had no way to see the PR diff cheaply
# (--allowedTools only granted Read/Grep/Glob, no `gh pr diff`/`gh pr view`),
# so the agent thrashed -- 16-22 permission denials and 54-68 turns per run,
# $2-3 each, one run failing outright. Pinned to Sonnet and granted the two
# read-only `gh` commands the official claude-code-action PR-review example
# (examples/pr-review-comprehensive.yml) uses for exactly this reason.
#
# Cost fix, part 2 (2026-07-30, same day): part 1 cut cost ~80% but the run
# still failed (hit --max-turns 20, which the action treats as a hard failure,
# not a graceful stop). Root-caused from the action's own source
# (src/mcp/install-mcp-server.ts): this workflow runs in "agent mode" (an
# explicit prompt, not a @claude mention), and in agent mode the comment-
# posting MCP server is only loaded if --allowedTools explicitly requests it --
# which it never did, in any of the five runs so far. Every run analyzed the
# PR and then had *no tool available to post the result* -- confirmed by
# every single run's log showing "No buffered inline comments." Fix:
# track_progress: true forces "tag mode," which always loads the comment
# server and creates the tracking comment update_claude_comment needs to
# exist before it can update it; the inline-comment server needs its own
# explicit --allowedTools grant regardless of mode, added above. --max-turns
# raised to 30 since posting the review is itself a few extra tool calls.
#
# Cost fix, part 3 (2026-07-31): part 2 fixed comment delivery (confirmed --
# the tracking comment updated live with real progress) but still hit
# --max-turns twice. Diagnosed with a one-off show_full_output: true run
# (see PR #40, reverted after) rather than guessing further: ~9 of the ~31
# turns were spent on denied Bash calls the agent kept retrying in different
# forms -- `npm test` (4+ variants), one `git fetch origin main`, one
# `find` across the filesystem -- none of which are granted or should be.
# The agent wasn't blocked from succeeding; it was trying to *execute*
# things (run the suite, search the filesystem) instead of *reading* them.
# Both runs actually completed the full review and posted a real, useful
# comment before erroring on the turn count -- so the "failure" was largely
# cosmetic, but still wasted turns/cost. Fixed by telling the prompt
# explicitly what is and isn't available and to evaluate tests by reading
# them, not running them, instead of granting broader (and riskier) Bash
# access.
#
# Cost fix, part 4 (2026-07-31): part 3 cut denials from 9 to 4 per run, but
# verification runs on PR #37 still hit --max-turns 30 despite completing a
# full, useful review both times (once fully, once correctly recognizing a
# re-review had nothing new to add) -- the run status just showed "failure"
# for what was functionally a success. Bumped to --max-turns 40 for headroom
# so the status reflects reality; the denial/thrash fix in part 3 is what
# actually mattered for cost, this is just clearing the remaining margin.
