name: Test Suite

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # Same filter as the local .claude/hooks/run-tests.js Stop hook: the race condition demo
      # (Counter_WithoutLock_ProducesUnpredictableResults) is intentionally, permanently broken to
      # demonstrate an unsynchronized counter (see CLAUDE.md) - not a regression to gate on.
      # Nothing else is excluded, deliberately: this workflow is meant to actually fail red when a
      # real test fails (e.g. ClaudeChatServiceTests on this runner), not report a decorative
      # green. No workflow in this repo ran `dotnet test` before this one - this failure mode was
      # invisible to CI until an unrelated diagnostic session stumbled into it by accident.
      - name: Run backend tests
        run: dotnet test LampLightLabs.JobSearch.Api.sln --filter "FullyQualifiedName!~Counter_WithoutLock_ProducesUnpredictableResults"

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run frontend tests
        working-directory: client
        run: npm test
